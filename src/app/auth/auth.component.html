<div class="row">
  <div class="col-xs-12 col-md-6 col-md-offset-3">
    <div *ngIf="error" class="alert alert-danger"><p>{{ error }}</p></div>
    <div *ngIf="isLoading" class="loading-spinner"><app-loading-spinner></app-loading-spinner></div>
    <form *ngIf="!isLoading" (ngSubmit)="onSubmit(authForm)" #authForm="ngForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" name="email" ngModel required email>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" name="password" ngModel required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="authForm.invalid">{{ isLoginMode ? "Login" : "Sign Up" }}</button>
      <button type="button" class="btn btn-primary" (click)="onSwitchMode()">Switch to {{ isLoginMode ? "Sign Up" : "Login" }}</button>
    </form>
  </div>
</div>
